# Docker Compose for local development.
# Starts all services plus Postgres, Redis, Azure Service Bus emulator, and Azure Storage emulator.
# Usage: docker compose up -d
version: "3.9"
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: devpassword }
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # Azure Service Bus emulator (community image — dev only)
  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    ports: ["5672:5672", "9092:9092"]

  # Azurite (Azure Storage emulator)
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports: ["10000:10000", "10001:10001", "10002:10002"]
